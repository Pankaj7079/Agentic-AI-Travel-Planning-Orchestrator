[project]
name = "parikrama-mcp"
version = "0.1.0"
description = "PariKrama MCP Server for AI assistant integration"
requires-python = ">=3.12"

dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "parikrama-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parikrama_mcp"]
