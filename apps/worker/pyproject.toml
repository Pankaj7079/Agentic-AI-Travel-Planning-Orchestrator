[project]
name = "parikrama-worker"
version = "0.1.0"
description = "PariKrama Celery workers"
requires-python = ">=3.12"

dependencies = [
    "celery[redis]>=5.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "minio>=7.2",
    "structlog>=24.1",
    "parikrama-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parikrama_worker"]
