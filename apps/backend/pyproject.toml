[project]
name = "parikrama-backend"
version = "0.1.0"
description = "PariKrama FastAPI backend"
requires-python = ">=3.12"

dependencies = [
    # -- Web Framework --
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # -- Database --
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # -- Validation & Config --
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # -- Auth & Security --
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",

    # -- Storage & Cache --
    "redis>=5.0",
    "minio>=7.2",

    # -- Monitoring --
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.5",
    "structlog>=24.1",

    # -- Shared --
    "parikrama-common",

    # -- Utilities --
    "httpx>=0.27",
    "tenacity>=8.3",
    "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parikrama"]
