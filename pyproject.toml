[project]
name = "parikrama"
version = "0.1.0"
description = "Agentic AI Travel Planning Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Pankaj"},
]

# root has no direct deps — each app manages its own
dependencies = []

[tool.uv]
managed = true

[tool.uv.workspace]
members = [
    "apps/backend",
    "apps/worker",
    "apps/mcp",
    "packages/common",
]

[tool.uv.sources]
parikrama-common = { workspace = true }

# ── Shared dev tools ──────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

# ── Ruff config (replaces black, isort, flake8) ─────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/*/src", "packages/*/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # type-checking imports
    "RUF", # ruff-specific
]
ignore = ["E501", "B008", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["parikrama", "parikrama_worker", "parikrama_mcp", "parikrama_common"]

# ── Mypy config ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Pytest config ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
]
